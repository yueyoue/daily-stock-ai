# 持续集成：每次 push/PR 自动验证（后端测试 + 前端类型检查/构建）
# 这就是"推送 GitHub 编译验证"的执行者；全量镜像构建见 build-image.yml（打 tag 时触发）
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.out
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "## ❌ pytest 失败输出"
              echo '```'
              tail -80 pytest.out
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
