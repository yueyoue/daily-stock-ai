name: data-fetch
# 自动抓取：从 results/ 归档恢复缓存 → 增量补抓缺失日线 → 逐批导出归档 → 提交推送
# 触发：手动（workflow_dispatch）或定时（美股时段，避开A股数据源高峰）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '抓取模式：both / qfq / raw'
        required: false
        default: 'both'
  schedule:
    - cron: '30 17 * * 1-5'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pandas requests pyarrow

      - name: Restore cache from repo archives
        run: python 主升浪信号验证/scripts/09_restore_cache.py 主升浪信号验证/results

      - name: Fetch missing kline (resumable, skips existing)
        run: python 主升浪信号验证/scripts/02_fetch_kline.py ${{ github.event.inputs.mode || 'both' }}

      - name: Export all batches to results/
        run: |
          python 主升浪信号验证/scripts/08_export_batch.py 0 1500 1
          python 主升浪信号验证/scripts/08_export_batch.py 1500 3000 2
          python 主升浪信号验证/scripts/08_export_batch.py 3000 4500 3
          python 主升浪信号验证/scripts/08_export_batch.py 4500 5223 4

      - name: Update DATA.md progress
        run: |
          sed -i "s|^> 最后更新：.*|> 最后更新：$(date -u +%Y-%m-%d\ %H:%M) UTC（GitHub Actions 自动抓取+归档）|" 主升浪信号验证/DATA.md

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 主升浪信号验证/results 主升浪信号验证/DATA.md
          git diff --cached --quiet || git commit -m "data: 自动抓取归档 $(date -u +%F)"
          git push
